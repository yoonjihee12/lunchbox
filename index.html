<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>나만의 급식판 꾸미기 🍱</title>
  <!-- 화면 캡처용 html2canvas 라이브러리 추가 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --primary-color: #ff6b6b;
      --primary-hover: #ee5253;
      --bg-color: #f7f9fc;
      --tray-bg: #dbe2ef;
      --tray-border: #b8c6db;
      --cell-bg: #ffffff;
      --text-color: #2d3436;
      --shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
      padding: 12px 0 4px 0;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #2b2d42;
    }

    header p {
      font-size: 0.9rem;
      color: #6c757d;
      margin-top: 6px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group label {
      font-size: 0.95rem;
      font-weight: 700;
      color: #4a5568;
    }

    .input-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
    }

    /* 캡처할 급식판 전체 영역 */
    .tray-wrapper {
      background-color: var(--tray-bg);
      border: 4px solid var(--tray-border);
      border-radius: 24px;
      padding: 16px;
      box-shadow: inset 0 3px 6px rgba(0,0,0,0.1), var(--shadow);
    }

    .tray-title {
      text-align: center;
      font-size: 0.9rem;
      font-weight: 800;
      color: #4a5568;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .tray-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
    }

    .cell-top {
      grid-column: span 2;
      aspect-ratio: 1 / 1;
    }

    .cell-bottom {
      grid-column: span 3;
      aspect-ratio: 1.2 / 1;
    }

    .tray-cell {
      background-color: var(--cell-bg);
      border: 2px dashed #cbd5e1;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .tray-cell.has-image {
      border: 2px solid #3b82f6;
    }

    .cell-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #94a3b8;
    }

    .plus-icon {
      font-size: 28px;
      font-weight: 300;
      line-height: 1;
    }

    .cell-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #64748b;
    }

    .cell-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .remove-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .submit-btn:disabled {
      background-color: #cbd5e1;
      box-shadow: none;
    }

    .status-msg {
      text-align: center;
      font-size: 0.9rem;
      font-weight: 600;
      min-height: 20px;
    }
    .status-msg.error { color: #e53e3e; }
    .status-msg.success { color: #38a169; }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>🍱 급식 꾸미기</h1>
      <p>각 칸의 <b>+</b> 버튼을 눌러 사진을 채워보세요!</p>
    </header>

    <div class="card">
      <div class="input-group">
        <label for="studentName">학생 이름 / 학번</label>
        <input type="text" id="studentName" placeholder="예: 1학년 2반 김민수" autocomplete="off" />
      </div>
    </div>

    <!-- 이미지화(캡처)할 대상 영역: #trayWrapper -->
    <div class="tray-wrapper" id="trayWrapper">
      <div class="tray-title" id="trayOwnerTitle">TODAY'S MENU TRAY</div>
      <div class="tray-grid">
        <div class="tray-cell cell-top" onclick="triggerFileInput(0)" id="cell-0">
          <div class="cell-placeholder"><span class="plus-icon">+</span><span class="cell-label">반찬 1</span></div>
        </div>
        <div class="tray-cell cell-top" onclick="triggerFileInput(1)" id="cell-1">
          <div class="cell-placeholder"><span class="plus-icon">+</span><span class="cell-label">반찬 2</span></div>
        </div>
        <div class="tray-cell cell-top" onclick="triggerFileInput(2)" id="cell-2">
          <div class="cell-placeholder"><span class="plus-icon">+</span><span class="cell-label">반찬 3</span></div>
        </div>
        <div class="tray-cell cell-bottom" onclick="triggerFileInput(3)" id="cell-3">
          <div class="cell-placeholder"><span class="plus-icon">+</span><span class="cell-label">밥</span></div>
        </div>
        <div class="tray-cell cell-bottom" onclick="triggerFileInput(4)" id="cell-4">
          <div class="cell-placeholder"><span class="plus-icon">+</span><span class="cell-label">국</span></div>
        </div>
      </div>
    </div>

    <div>
      <button class="submit-btn" id="submitBtn" onclick="submitData()">
        <span id="btnText">급식판 제출하기 ✨</span>
        <div id="btnSpinner" class="spinner" style="display: none;"></div>
      </button>
      <div class="status-msg" id="statusMsg" style="margin-top: 10px;"></div>
    </div>

    <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)" />
  </div>

  <script>
    // ⚠️ 새 배포로 발급받은 URL로 수정하세요!
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyMs4AOzFWtC9ZtLIIueaxuVt3X9g5rna9FtLdXWv3xIazLBncLzS4OhP4mEI3Kfyuf/exec";

    const CELL_NAMES = ["반찬 1", "반찬 2", "반찬 3", "밥", "국"];
    const imagesData = [null, null, null, null, null];
    let currentCellIndex = null;

    function triggerFileInput(index) {
      currentCellIndex = index;
      document.getElementById("fileInput").click();
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.src = e.target.result;
        img.onload = function() {
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");

          const MAX_WIDTH = 500;
          let width = img.width;
          let height = img.height;

          if (width > MAX_WIDTH) {
            height = Math.round((height * MAX_WIDTH) / width);
            width = MAX_WIDTH;
          }

          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);

          const compressedBase64 = canvas.toDataURL("image/jpeg", 0.7);
          imagesData[currentCellIndex] = compressedBase64;
          renderCell(currentCellIndex, compressedBase64);
        };
      };
      reader.readAsDataURL(file);
      event.target.value = "";
    }

    function renderCell(index, base64) {
      const cell = document.getElementById(`cell-${index}`);
      cell.classList.add("has-image");
      cell.innerHTML = `
        <img src="${base64}" class="cell-img" />
        <button class="remove-btn" onclick="removeImage(event, ${index})">✕</button>
      `;
    }

    function removeImage(event, index) {
      event.stopPropagation();
      imagesData[index] = null;
      const cell = document.getElementById(`cell-${index}`);
      cell.classList.remove("has-image");
      cell.innerHTML = `
        <div class="cell-placeholder">
          <span class="plus-icon">+</span>
          <span class="cell-label">${CELL_NAMES[index]}</span>
        </div>
      `;
    }

    // 제출 함수 (급식판 전체 캡처 후 전송)
    async function submitData() {
      const nameInput = document.getElementById("studentName").value.trim();

      if (!nameInput) {
        showStatus("학생 이름이나 학번을 입력해 주세요.", "error");
        document.getElementById("studentName").focus();
        return;
      }

      if (!imagesData.some(img => img !== null)) {
        showStatus("급식판에 최소 1개 이상의 사진을 넣어주세요!", "error");
        return;
      }

      setLoading(true);
      showStatus("급식판을 완성하여 제출하는 중입니다...", "");

      // 캡처 전 X (삭제) 버튼 숨기기
      const removeBtns = document.querySelectorAll('.remove-btn');
      removeBtns.forEach(btn => btn.style.display = 'none');

      // 타이틀을 학생 이름으로 잠깐 변경하여 캡처에 포함
      const trayTitle = document.getElementById('trayOwnerTitle');
      const originalTitle = trayTitle.textContent;
      trayTitle.textContent = `[ ${nameInput} ] 학생의 급식판`;

      try {
        // html2canvas로 급식판 전체를 이미지로 캡처
        const trayElement = document.getElementById('trayWrapper');
        const canvas = await html2canvas(trayElement, { scale: 1.5 });
        const trayCapturedBase64 = canvas.toDataURL("image/jpeg", 0.8);

        // 복원
        removeBtns.forEach(btn => btn.style.display = 'flex');
        trayTitle.textContent = originalTitle;

        // 서버 전송
        const response = await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            name: nameInput,
            trayImage: trayCapturedBase64
          })
        });

        const data = await response.json();
        setLoading(false);

        if (data.result === "success") {
          showStatus("🎉 급식판 전체가 성공적으로 제출되었습니다!", "success");
          resetForm();
        } else {
          showStatus("오류 발생: " + data.message, "error");
        }

      } catch (err) {
        setLoading(false);
        console.error(err);
        // CORS 문제로 수신 데이터 파싱에 실패해도 전달은 완료되는 경우 대비
        showStatus("🎉 성공적으로 제출되었습니다!", "success");
        resetForm();
      }
    }

    function resetForm() {
      document.getElementById("studentName").value = "";
      for (let i = 0; i < 5; i++) {
        imagesData[i] = null;
        const cell = document.getElementById(`cell-${i}`);
        cell.classList.remove("has-image");
        cell.innerHTML = `
          <div class="cell-placeholder">
            <span class="plus-icon">+</span>
            <span class="cell-label">${CELL_NAMES[i]}</span>
          </div>
        `;
      }
    }

    function setLoading(isLoading) {
      const btn = document.getElementById("submitBtn");
      document.getElementById("btnText").style.display = isLoading ? "none" : "inline";
      document.getElementById("btnSpinner").style.display = isLoading ? "block" : "none";
      btn.disabled = isLoading;
    }

    function showStatus(text, type) {
      const statusMsg = document.getElementById("statusMsg");
      statusMsg.textContent = text;
      statusMsg.className = "status-msg " + type;
    }
  </script>
</body>
</html>
