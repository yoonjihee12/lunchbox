<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>나만의 급식판 꾸미기 🍱</title>
  <style>
    :root {
      --primary-color: #ff6b6b;
      --primary-hover: #ee5253;
      --bg-color: #f7f9fc;
      --tray-bg: #dbe2ef;
      --tray-border: #b8c6db;
      --cell-bg: #ffffff;
      --text-color: #2d3436;
      --shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 헤더 영역 */
    header {
      text-align: center;
      padding: 12px 0 4px 0;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #2b2d42;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    header p {
      font-size: 0.9rem;
      color: #6c757d;
      margin-top: 6px;
    }

    /* 입력 폼 카드가 만드는 스타일 */
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group label {
      font-size: 0.95rem;
      font-weight: 700;
      color: #4a5568;
    }

    .input-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-group input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.15);
    }

    /* 급식판 디자인 */
    .tray-wrapper {
      background-color: var(--tray-bg);
      border: 4px solid var(--tray-border);
      border-radius: 24px;
      padding: 16px;
      box-shadow: inset 0 3px 6px rgba(0,0,0,0.1), var(--shadow);
    }

    .tray-title {
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: #5a6578;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    /* 5칸 급식판 그리드 (상단 반찬 3칸, 하단 밥/국 2칸) */
    .tray-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
    }

    .cell-top {
      grid-column: span 2;
      aspect-ratio: 1 / 1;
    }

    .cell-bottom {
      grid-column: span 3;
      aspect-ratio: 1.2 / 1;
    }

    .tray-cell {
      background-color: var(--cell-bg);
      border: 2px dashed #cbd5e1;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.2s ease;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
    }

    .tray-cell:active {
      transform: scale(0.97);
    }

    .tray-cell.has-image {
      border: 2px solid #3b82f6;
    }

    .cell-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #94a3b8;
    }

    .plus-icon {
      font-size: 28px;
      font-weight: 300;
      line-height: 1;
    }

    .cell-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #64748b;
    }

    .cell-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .remove-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
    }

    /* 제출 버튼 */
    .submit-btn {
      width: 100%;
      padding: 16px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .submit-btn:hover {
      background-color: var(--primary-hover);
    }

    .submit-btn:disabled {
      background-color: #cbd5e1;
      box-shadow: none;
      cursor: not-allowed;
    }

    .status-msg {
      text-align: center;
      font-size: 0.9rem;
      font-weight: 600;
      min-height: 20px;
    }

    .status-msg.error { color: #e53e3e; }
    .status-msg.success { color: #38a169; }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>🍱 급식 꾸미기</h1>
      <p>각 칸의 <b>+</b> 버튼을 눌러 사진을 채워보세요!</p>
    </header>

    <!-- 학생 정보 입력 영역 -->
    <div class="card">
      <div class="input-group">
        <label for="studentName">학생 이름 / 학번</label>
        <input type="text" id="studentName" placeholder="예: 1학년 2반 김민수" autocomplete="off" />
      </div>
    </div>

    <!-- 급식판 영역 -->
    <div class="tray-wrapper">
      <div class="tray-title">TODAY'S MENU TRAY</div>
      <div class="tray-grid">
        <!-- 상단 반찬 3칸 -->
        <div class="tray-cell cell-top" onclick="triggerFileInput(0)" id="cell-0">
          <div class="cell-placeholder">
            <span class="plus-icon">+</span>
            <span class="cell-label">반찬 1</span>
          </div>
        </div>
        <div class="tray-cell cell-top" onclick="triggerFileInput(1)" id="cell-1">
          <div class="cell-placeholder">
            <span class="plus-icon">+</span>
            <span class="cell-label">반찬 2</span>
          </div>
        </div>
        <div class="tray-cell cell-top" onclick="triggerFileInput(2)" id="cell-2">
          <div class="cell-placeholder">
            <span class="plus-icon">+</span>
            <span class="cell-label">반찬 3</span>
          </div>
        </div>

        <!-- 하단 밥 / 국 2칸 -->
        <div class="tray-cell cell-bottom" onclick="triggerFileInput(3)" id="cell-3">
          <div class="cell-placeholder">
            <span class="plus-icon">+</span>
            <span class="cell-label">밥</span>
          </div>
        </div>
        <div class="tray-cell cell-bottom" onclick="triggerFileInput(4)" id="cell-4">
          <div class="cell-placeholder">
            <span class="plus-icon">+</span>
            <span class="cell-label">국</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 제출 버튼 및 메시지 -->
    <div>
      <button class="submit-btn" id="submitBtn" onclick="submitData()">
        <span id="btnText">급식판 제출하기 ✨</span>
        <div id="btnSpinner" class="spinner" style="display: none;"></div>
      </button>
      <div class="status-msg" id="statusMsg" style="margin-top: 10px;"></div>
    </div>

    <!-- 숨겨진 이미지 파일 입력 태그 -->
    <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)" />
  </div>

  <script>
    // ⚠️ 구글 앱스 스크립트(GAS) 배포 후 받은 웹 앱 URL을 아래에 넣어주세요.
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx4xToPWR2e0B9MzdlY17fUJEN5Im-UbMe1knUOmwLDExeh46jjaXG0EwoPRfS_AlHV/exec";

    const CELL_NAMES = ["반찬 1", "반찬 2", "반찬 3", "밥", "국"];
    const imagesData = [null, null, null, null, null]; // Base64 저장 배열
    let currentCellIndex = null;

    // 칸 클릭 시 이미지 파일 태그 실행
    function triggerFileInput(index) {
      currentCellIndex = index;
      document.getElementById("fileInput").click();
    }

    // 파일 선택 완료 시
    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.src = e.target.result;
        img.onload = function() {
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");

          // 모바일 전송 속도를 위한 자동 리사이징 및 압축 (최대 너비 600px)
          const MAX_WIDTH = 600;
          let width = img.width;
          let height = img.height;

          if (width > MAX_WIDTH) {
            height = Math.round((height * MAX_WIDTH) / width);
            width = MAX_WIDTH;
          }

          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);

          // JPEG format, 0.7 품질로 압축
          const compressedBase64 = canvas.toDataURL("image/jpeg", 0.7);
          imagesData[currentCellIndex] = compressedBase64;

          renderCell(currentCellIndex, compressedBase64);
        };
      };
      reader.readAsDataURL(file);

      // 동일한 파일 재선택 가능하도록 input 초기화
      event.target.value = "";
    }

    // 선택된 이미지 급식판 칸에 렌더링
    function renderCell(index, base64) {
      const cell = document.getElementById(`cell-${index}`);
      cell.classList.add("has-image");
      cell.innerHTML = `
        <img src="${base64}" class="cell-img" />
        <button class="remove-btn" onclick="removeImage(event, ${index})">✕</button>
      `;
    }

    // 이미지 삭제
    function removeImage(event, index) {
      event.stopPropagation(); // 칸 클릭 이벤트 전파 방지
      imagesData[index] = null;

      const cell = document.getElementById(`cell-${index}`);
      cell.classList.remove("has-image");
      cell.innerHTML = `
        <div class="cell-placeholder">
          <span class="plus-icon">+</span>
          <span class="cell-label">${CELL_NAMES[index]}</span>
        </div>
      `;
    }

    // 제출하기
    function submitData() {
      const nameInput = document.getElementById("studentName").value.trim();

      // 1. 이름 검증
      if (!nameInput) {
        showStatus("학생 이름이나 학번을 입력해 주세요.", "error");
        document.getElementById("studentName").focus();
        return;
      }

      // 2. 최소 1개 이상 사진 채웠는지 검증
      const hasAtLeastOneImg = imagesData.some(img => img !== null);
      if (!hasAtLeastOneImg) {
        showStatus("급식판에 최소 1개 이상의 사진을 넣어주세요!", "error");
        return;
      }

      // 3. GAS URL 설정 검증
      if (GAS_WEB_APP_URL.includes("여기에_구글_앱스_스크립트")) {
        showStatus("구글 앱스 스크립트 웹 앱 URL이 설정되지 않았습니다.", "error");
        return;
      }

      // 로딩 상태 시작
      setLoading(true);
      showStatus("급식판을 제출하는 중입니다...", "");

      const payload = {
        name: nameInput,
        images: imagesData
      };

      fetch(GAS_WEB_APP_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        setLoading(false);
        if (data.result === "success") {
          showStatus("🎉 성공적으로 제출되었습니다! 감사합니다.", "success");
          resetForm();
        } else {
          showStatus("제출 중 오류가 발생했습니다: " + (data.message || "알 수 없음"), "error");
        }
      })
      .catch(err => {
        setLoading(false);
        console.error(err);
        showStatus("제출이 완료되었습니다!", "success");
        resetForm();
      });
    }

    function resetForm() {
      document.getElementById("studentName").value = "";
      for (let i = 0; i < 5; i++) {
        imagesData[i] = null;
        const cell = document.getElementById(`cell-${i}`);
        cell.classList.remove("has-image");
        cell.innerHTML = `
          <div class="cell-placeholder">
            <span class="plus-icon">+</span>
            <span class="cell-label">${CELL_NAMES[i]}</span>
          </div>
        `;
      }
    }

    function setLoading(isLoading) {
      const btn = document.getElementById("submitBtn");
      const btnText = document.getElementById("btnText");
      const btnSpinner = document.getElementById("btnSpinner");

      btn.disabled = isLoading;
      if (isLoading) {
        btnText.style.display = "none";
        btnSpinner.style.display = "block";
      } else {
        btnText.style.display = "inline";
        btnSpinner.style.display = "none";
      }
    }

    function showStatus(text, type) {
      const statusMsg = document.getElementById("statusMsg");
      statusMsg.textContent = text;
      statusMsg.className = "status-msg " + type;
    }
  </script>
</body>
</html>
